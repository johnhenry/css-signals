name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest", "windows-latest"]'
      gate-commands: npm test
      # css/*.css is generated from src/ for the default prefix and is
      # shipped in the package. A stale copy would publish CSS that
      # disagrees with the JS.
      drift-check: true
      drift-build-command: npm run build:css
      drift-path: css
